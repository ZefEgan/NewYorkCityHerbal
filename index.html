<html lang="en">
    <head>
        <meta charset="utf-8">

        <style>
        html, body {
            background-color: #d0e1f9;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #7ca89d!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #7ca89d!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;

        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
 
  /* Desktop Filter Container Styles */
  #filter-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      color: #7ca89d;
      font-family: sans-serif;
  }

  #speciesSelect {
      color: #7ca89d;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #7ca89d;
      background-color: #fff;
  }

  /* Mobile Adjustments for Phones & Tablets (iPads) */
  @media only screen and (max-width: 1024px) {
      /* Hide zoom + and - controls on mobile */
      .ol-zoom {
          display: none !important;
      }

      /* Compact species filter in top right corner */
      #filter-container {
          top: 10px;
          right: 10px;
          left: auto;
          max-width: 200px;
          padding: 6px 10px;
          display: flex;
          flex-direction: column;
          gap: 4px;
      }

      #speciesSelect {
          width: 100%;
          font-size: 14px;
      }

      /* Position Address Search control below top controls on mobile */
      .ol-geocoder, 
      .gcd-gl-control,
      .ol-touch .ol-control.ol-geocoder {
          top: 70px !important;
          left: 10px !important;
      }
  }
        </style>
        <title></title>
    </head>
    <body>
      <div id="filter-container" style="position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 8px; border-radius: 4px; box-shadow: 0 0 5px rgba(0,0,0,0.3);">
        <label for="speciesSelect" style="color: #7ca89d;"><strong>Search Species:</strong></label>
        <select id="speciesSelect">
          <option value="">-- Show All --</option>
        </select>
    </div>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/Boroughs_0.js"></script><script src="layers/Cemeteries_1.js"></script><script src="layers/ProspectPark_2.js"></script><script src="layers/Parks_3.js"></script><script src="layers/MajorRoads_4.js"></script><script src="layers/WaterFeature_5.js"></script><script src="layers/IllustratedHerbal_6.js"></script>
        <script src="styles/Boroughs_0_style.js"></script><script src="styles/Cemeteries_1_style.js"></script><script src="styles/ProspectPark_2_style.js"></script><script src="styles/Parks_3_style.js"></script><script src="styles/MajorRoads_4_style.js"></script><script src="styles/WaterFeature_5_style.js"></script><script src="styles/IllustratedHerbal_6_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script>
// Reference the OpenLayers layer variable created inside layers.js
      var plantLayer = lyr_IllustratedHerbal_6; 
      var fieldName = 'scientific';


// Highlights: radius 4.8, #7ca89d fill, no stroke
var highlightStyle = new ol.style.Style({
  image: new ol.style.Circle({
    radius: 4.8,
    fill: new ol.style.Fill({ color: '#7ca89d' })
  })
}); 

var source = plantLayer.getSource();

function initFilter() {
  // Capture initial view center and zoom level on page load
  var initialCenter = map.getView().getCenter();
  var initialZoom = map.getView().getZoom();

  // Detect mobile device / touch interface
  var isTouchDevice = ('ontouchstart' in window) || 
                      (navigator.maxTouchPoints > 0) || 
                      (window.innerWidth <= 1024);

  // 50px touch radius ONLY used for nearest-neighbor snapping on mobile
  var MAX_TOUCH_DISTANCE_PX = 50; 

  var speciesSet = new Set();

  // Populate dropdown options with unique species names
  source.forEachFeature(function(feature) {
    var val = feature.get(fieldName);
    if (val) speciesSet.add(val);
  });

  var selectElem = document.getElementById('speciesSelect');
  Array.from(speciesSet).sort().forEach(function(species) {
    var opt = document.createElement('option');
    opt.value = species;
    opt.innerHTML = species;
    selectElem.appendChild(opt);
  });

  // Reusable filter & highlight function
  function filterBySpecies(selectedSpecies) {
    selectElem.value = selectedSpecies; // Keep dropdown UI in sync

    var extent = ol.extent.createEmpty();
    var matchCount = 0;

    source.forEachFeature(function(feature) {
      if (selectedSpecies === "" || feature.get(fieldName) === selectedSpecies) {
        if (selectedSpecies !== "") {
          feature.setStyle(highlightStyle);
          ol.extent.extend(extent, feature.getGeometry().getExtent());
          matchCount++;
        } else {
          feature.setStyle(null); // Reset to base qgis2web style
        }
      } else {
        feature.setStyle(new ol.style.Style(null)); // Hide non-matches
      }
    });

    if (matchCount > 0) {
      var view = map.getView();
      var size = map.getSize();
      
      var targetResolution = view.getResolutionForExtent(extent, size);
      var targetZoom = view.getZoomForResolution(targetResolution);
      
      // Calculate capped zoom level (never zoom out farther than initialZoom)
      var cappedZoom = Math.min(Math.max(targetZoom - 0.5, 0), 16);
      cappedZoom = Math.max(cappedZoom, initialZoom);

      var center = ol.extent.getCenter(extent);

      view.animate({
        center: center,
        zoom: cappedZoom,
        duration: 300
      });

    } else if (selectedSpecies === "") {
      // Reset view back to exact initial center and zoom level
      map.getView().animate({
        center: initialCenter,
        zoom: initialZoom,
        duration: 300
      });
    }
  }

  // MOBILE ONLY Helper: Find closest plant feature strictly on plantLayer within 50px radius
  function getNearestPlantFeatureAtPixel(pixel, maxDistancePx) {
    var nearestFeature = null;
    var minDistanceSq = maxDistancePx * maxDistancePx;

    // Iterate exclusively over features in plantLayer's source
    source.forEachFeature(function(feature) {
      // Skip hidden features (non-matching species when filtered)
      if (feature.getStyle() && feature.getStyle().getImage() === null) {
        return;
      }

      var geom = feature.getGeometry();
      if (geom) {
        var coord = geom.getCoordinates();
        var featurePixel = map.getPixelFromCoordinate(coord);
        
        if (featurePixel) {
          var dx = featurePixel[0] - pixel[0];
          var dy = featurePixel[1] - pixel[1];
          var distSq = dx * dx + dy * dy;

          if (distSq < minDistanceSq) {
            minDistanceSq = distSq;
            nearestFeature = feature;
          }
        }
      }
    });

    return nearestFeature;
  }

  // 1. Dropdown Change Listener
  selectElem.addEventListener('change', function() {
    filterBySpecies(this.value);
  });

  // 2. Map Tap / Click Listener
  if (!isTouchDevice) {
    // DESKTOP: Exact pixel match strictly on plantLayer
    map.on('singleclick', function(evt) {
      var clickedFeature = null;

      map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
        if (layer === plantLayer) {
          clickedFeature = feature;
          return true;
        }
      });

      if (clickedFeature) {
        var species = clickedFeature.get(fieldName);
        if (species) {
          filterBySpecies(species);
        }
      } else {
        filterBySpecies("");
      }
    });
  } else {
    // MOBILE ONLY: Tap detection locked exclusively to plantLayer features
    map.on('singleclick', function(evt) {
      var nearestFeature = getNearestPlantFeatureAtPixel(evt.pixel, MAX_TOUCH_DISTANCE_PX);

      if (nearestFeature) {
        // Trigger qgis2web default popup strictly for the nearest plant feature
        if (typeof createPopup === 'function') {
          var featureCoord = nearestFeature.getGeometry().getCoordinates();
          createPopup(featureCoord, nearestFeature);
        }
      } else {
        // Clear popup and reset filter when tapping empty space
        if (typeof container !== 'undefined' && container) {
          var overlay = map.getOverlayById ? map.getOverlayById('popup') : null;
          if (overlay) overlay.setPosition(undefined);
        }
        filterBySpecies("");
      }
    });
  }
}

// Ensure source data is loaded before reading features
if (source.getState() === 'ready') {
  initFilter();
} else {
  source.once('change', function() {
    if (source.getState() === 'ready') {
      initFilter();
    }
  });
}
        </script>        
    </body>
</html>
